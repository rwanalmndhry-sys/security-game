<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تحدي الوعي الرقمي 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Tajawal', sans-serif; 
            background: #0f172a;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }
        .app-card {
            background: #ffffff;
            width: 95%;
            max-width: 420px;
            border-radius: 2rem;
            min-height: 600px;
            display: flex;
            flex-direction: column;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
        }
        .btn-opt {
            width: 100%;
            padding: 1.2rem;
            border: 2px solid #f1f5f9;
            border-radius: 1.2rem;
            background: #f8fafc;
            font-weight: 700;
            color: #334155;
            text-align: right;
            transition: 0.2s;
            cursor: pointer;
            outline: none !important;
            display: block;
        }
        .btn-opt:hover {
            border-color: #3b82f6;
            background: #eff6ff;
        }
        .btn-opt:active {
            transform: scale(0.96);
        }
        .icon-box {
            width: 80px;
            height: 80px;
            background: #eff6ff;
            border-radius: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 1.5rem;
        }
        .animate-fade {
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="quiz-app" class="app-card">
        <!-- المحتوى يتغير برمجياً -->
    </div>

    <script>
        const rawData = [
            { i: "📧", q: "وصلك إيميل يطلب منك تحديث كلمة سرك فوراً عبر رابط خارجي. ماذا تفعل؟", 
              o: [{t: "أضغط على الرابط بسرعة", c: false, m: "خطأ! الاستعجال هو فخ التصيد الأول."}, {t: "أحذف الرسالة وأبلغ التقنية", c: true, m: "رائع! الحذر هو أقوى سلاح."}] },
            
            { i: "🔐", q: "أي كلمة مرور هي الأفضل لحماية حسابك؟", 
              o: [{t: "Password123", c: false, m: "سهلة الاختراق جداً!"}, {t: "M@rch#2026!Sky", c: true, m: "ممتاز! الطول والرموز هما السر."}] },
            
            { i: "💻", q: "ستترك مكتبك للصلاة أو لاجتماع سريع. ما هي الطريقة الأسرع والأضمن لحماية جهازك؟", 
              o: [{t: "أتركه مفتوحاً (5 دقائق فقط)", c: false, m: "غير آمن! الثواني كافية لسرقة بيانات أو زرع برمجيات خبيثة."}, {t: "ضغط Win + L (قفل الشاشة فوراً)", c: true, m: "بطل! اختصار Win + L في ويندوز (أو Control+Cmd+Q في ماك) هو درعك السريع."}] },
            
            { i: "💾", q: "وجدت فلاش ميموري مجهول في ممر العمل. ماذا تفعل؟", 
              o: [{t: "أجربه لأعرف ما بداخله", c: false, m: "خطر! قد يحتوي على فيروسات تجسس."}, {t: "أسلمه للأمن فوراً", c: true, m: "ذكي! الأجهزة المجهولة فخاخ رقمية."}] },
            
            { i: "📱", q: "رسالة من البنك تطلب منك الضغط على رابط لتحديث بياناتك. هل تضغط؟", 
              o: [{t: "نعم، لتجنب إيقاف الحساب", c: false, m: "خطأ! البنوك لا تطلب البيانات عبر روابط نصية."}, {t: "لا، أتصل بالبنك مباشرة", c: true, m: "أحسنت! التواصل الرسمي هو الأضمن."}] },
            
            { i: "📡", q: "أنت في مقهى وتحتاج للدخول على حسابات العمل الحساسة، أي وسيلة اتصال تختار؟", 
              o: [{t: "واي فاي المقهى المجاني", c: false, m: "خطر! الشبكات العامة تفتقر للتشفير وسهلة الاختراق."}, {t: "نقطة اتصال 4G/5G من جوالك", c: true, m: "رائع! اتصال البيانات الشخصي (Cellular) أكثر أماناً وتشفيرًا."}] },
            
            { i: "⚙️", q: "هناك تحديث أمني متاح لنظامك. متى تثبته؟", 
              o: [{t: "عندما أفضى لاحقاً", c: false, m: "خطر! التأجيل يعرضك للثغرات."}, {t: "الآن فوراً", c: true, m: "بطل! التحديثات هي درعك المتجدد."}] },
            
            { i: "📞", q: "اتصال يدعي صاحبه أنه من الدعم الفني ويطلب رقمك السري. هل تعطيه؟", 
              o: [{t: "نعم، ليحل المشكلة", c: false, m: "خطر! لا أحد يطلب رقمك السري هاتفياً."}, {t: "أرفض وأغلق الخط", c: true, m: "ممتاز! أنت محصن ضد الهندسة الاجتماعية."}] },
            
            { i: "📷", q: "تصور صورة في المكتب وتظهر فيها أوراق سرية. هل تنشرها؟", 
              o: [{t: "نعم، الصورة جميلة", c: false, m: "خطأ! تسريب البيانات بالصور كارثة أمنية."}, {t: "أمسحها أو أخفي البيانات", c: true, m: "واعي! التفاصيل الصغيرة تصنع الأمان."}] },
            
            { i: "📥", q: "تطبيق يطلب صلاحية الوصول لموقعك وصورك دون سبب واضح. هل توافق؟", 
              o: [{t: "نعم، أريد استخدامه", c: false, m: "خطر! الصلاحيات الزائدة تفتح باب التجسس."}, {t: "أرفض وأحذف التطبيق", c: true, m: "رائع! بياناتك الشخصية لا تقدر بثمن."}] }
        ];

        let questions = [];
        let cur = 0;
        let score = 0;
        const app = document.getElementById('quiz-app');

        function shuffle(arr) { return arr.sort(() => Math.random() - 0.5); }

        function start() {
            questions = shuffle([...rawData]);
            app.innerHTML = `
                <div class="my-auto text-center animate-fade">
                    <div class="text-8xl mb-6">🛡️</div>
                    <h1 class="text-3xl font-black text-slate-800 mb-4">تحدي الأمان الرقمي</h1>
                    <p class="text-slate-500 mb-10">هل أنت مستعد لاختبار وعيك السيبراني في بيئة العمل؟</p>
                    <button onclick="renderQ()" class="w-full bg-blue-600 text-white font-bold py-5 rounded-2xl shadow-lg active:scale-95 transition-all">ابدأ التحدي (10 مواقف)</button>
                </div>
            `;
        }

        function renderQ() {
            if(cur >= questions.length) { finish(); return; }
            const qObj = questions[cur];
            const opts = shuffle([...qObj.o]);

            app.innerHTML = `
                <div class="w-full bg-slate-100 h-2 rounded-full mb-8 overflow-hidden">
                    <div class="bg-blue-600 h-full transition-all duration-500" style="width:${(cur+1)*10}%"></div>
                </div>
                <div class="icon-box animate-fade">${qObj.i}</div>
                <div class="text-center mb-8 flex-grow animate-fade">
                    <p class="text-sm font-bold text-blue-600 mb-2 uppercase tracking-widest">الموقف ${cur+1}</p>
                    <h2 class="text-xl font-bold text-slate-800 leading-relaxed">${qObj.q}</h2>
                </div>
                <div class="grid gap-4 animate-fade">
                    ${opts.map(opt => `
                        <button onclick="check(${opt.c}, '${opt.m}')" class="btn-opt">${opt.t}</button>
                    `).join('')}
                </div>
            `;
        }

        function check(isC, msg) {
            if(isC) score++;
            app.innerHTML = `
                <div class="my-auto text-center animate-fade">
                    <div class="text-8xl mb-6">${isC ? '✅' : '❌'}</div>
                    <h2 class="text-3xl font-black mb-4 ${isC ? 'text-green-600' : 'text-red-500'}">${isC ? 'إجابة ذكية!' : 'تنبيه أمني!'}</h2>
                    <div class="bg-slate-50 p-6 rounded-2xl mb-10 border-2 border-slate-100">
                        <p class="text-slate-600 font-bold leading-relaxed">${msg}</p>
                    </div>
                    <button onclick="next()" class="w-full bg-slate-900 text-white font-bold py-5 rounded-2xl shadow-lg active:scale-95 transition-all">الموقف التالي</button>
                </div>
            `;
        }

        function next() { cur++; renderQ(); }

        function finish() {
            let rank = score >= 9 ? "خبير أمن سيبراني 🎖️" : (score >= 6 ? "واعي تقنياً 👍" : "تحتاج لمراجعة إجراءاتك ⚠️");
            app.innerHTML = `
                <div class="my-auto text-center animate-fade">
                    <p class="text-slate-400 font-bold mb-2">نتيجتك النهائية</p>
                    <div class="text-8xl font-black text-blue-600 mb-6">${score}/10</div>
                    <h2 class="text-2xl font-bold text-slate-800 mb-10">${rank}</h2>
                    <button onclick="location.reload()" class="w-full bg-blue-600 text-white font-bold py-5 rounded-2xl shadow-lg">إعادة الاختبار</button>
                </div>
            `;
        }

        start();
    </script>
</body>
</html>
