<!DOCTYPE html>

<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي بطل الأمن السيبراني (10 مراحل)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Tajawal', sans-serif; 
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .app-container {
            width: 100%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            min-height: 600px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: slideUp 0.6s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .option-btn {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid #e2e8f0;
        }
        .option-btn:hover {
            border-color: #3b82f6;
            background-color: #eff6ff;
            transform: translateX(-5px);
        }
        .result-screen { animation: fadeIn 0.4s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div id="game-box" class="app-container">
        <!-- المحتوى يتغير بواسطة JavaScript -->
    </div>

    <script>
        const allQuestions = [
            {
                icon: "📧",
                title: "رسالة بريد عاجلة!",
                q: "وصلك إيميل يطلب منك تحديث كلمة سرك فوراً عبر رابط خارجي لأن حسابك سيتوقف. ماذا تفعل؟",
                options: [
                    { text: "أضغط على الرابط بسرعة", correct: false, msg: "خطأ! هذا أسلوب 'الاستعجال' الذي يستخدمه المخترقون للتصيد." },
                    { text: "أحذف الرسالة وأبلغ قسم التقنية", correct: true, msg: "ممتاز! الوعي بأساليب التصيد هو أهم خط دفاع." }
                ]
            },
            {
                icon: "🔐",
                title: "قوة كلمة المرور",
                q: "أي من هذه الخيارات تعتبر الأقوى لحماية حساباتك؟",
                options: [
                    { text: "Admin@123", correct: false, msg: "ضعيفة! الكلمات الشائعة يسهل اختراقها ببرامج التخمين." },
                    { text: "Blue#Tree@Sky2024", correct: true, msg: "رائع! استخدام الرموز والطول يجعل الاختراق شبه مستحيل." }
                ]
            },
            {
                icon: "☕",
                title: "استراحة المكتب",
                q: "ستذهب لإحضار قهوة وستعود بعد دقيقتين. كيف تترك جهازك؟",
                options: [
                    { text: "أتركه مفتوحاً للمدة القصيرة", correct: false, msg: "غير آمن! دقيقة واحدة تكفي للوصول لبيانات حساسة." },
                    { text: "أقفل الشاشة (Win + L)", correct: true, msg: "بطل! قفل الشاشة يجب أن يكون حركة تلقائية دائماً." }
                ]
            },
            {
                icon: "💾",
                title: "الفلاش المفقود",
                q: "وجدت فلاش ميموري (USB) في المصعد مكتوب عليه 'الرواتب'. ماذا تفعل؟",
                options: [
                    { text: "أوصله بجهازي لأعرف صاحبه", correct: false, msg: "خطر جداً! قد يحتوي على برمجيات خبيثة تخترق الشبكة فوراً." },
                    { text: "أسلمه للأمن دون فتحه", correct: true, msg: "تصرف ذكي! الفلاشات المجهولة هي فخاخ فيروسات شهيرة." }
                ]
            },
            {
                icon: "🛡️",
                title: "رسائل الجوال",
                q: "وصلتك رسالة نصية تطلب ضغط رابط لتحديث بياناتك البنكية فوراً. ماذا تفعل؟",
                options: [
                    { text: "أضغط للتأكد من حسابي", correct: false, msg: "خطأ! الروابط في الرسائل المجهولة هي أسرع وسيلة للسرقة." },
                    { text: "أتجاهل الرسالة وأبلغ عنها", correct: true, msg: "أحسنت! تجاهل الروابط المشبوهة هو ذكاء سيبراني." }
                ]
            },
            {
                icon: "🌐",
                title: "واي فاي المقهى",
                q: "أنت في مقهى وتحتاج للدخول على حساب العمل الحساس. ماذا تستخدم؟",
                options: [
                    { text: "واي فاي المقهى المجاني", correct: false, msg: "خطر! الشبكات العامة يسهل التجسس عليها وسرقة بياناتك." },
                    { text: "نقطة اتصال شخصية (4G/5G)", correct: true, msg: "رائع! استخدام اتصالك الخاص أكثر أماناً للعمل الحساس." }
                ]
            },
            {
                icon: "🆙",
                title: "تحديثات النظام",
                q: "ظهر لك إشعار يطلب تحديث نظام التشغيل فوراً. ماذا تفعل؟",
                options: [
                    { text: "تأجيل التحديث للأسبوع القادم", correct: false, msg: "خطأ! التحديثات تحتوي على إصلاحات لثغرات أمنية خطيرة." },
                    { text: "تثبيت التحديث في أقرب وقت", correct: true, msg: "بطل! إبقاء نظامك محدثاً يسد الثغرات أمام المخترقين." }
                ]
            },
            {
                icon: "📞",
                title: "مكالمة غريبة",
                q: "اتصل بك شخص يدعي أنه من 'الدعم الفني' ويطلب كود التحقق الذي وصلك. ماذا تفعل؟",
                options: [
                    { text: "أعطيه الكود ليساعدني", correct: false, msg: "خطر! لا تشارك أبداً أكواد التحقق (OTP) مع أي شخص." },
                    { text: "أنهي المكالمة فوراً", correct: true, msg: "أحسنت! الشركات الحقيقية لا تطلب منك أكوادك السرية أبداً." }
                ]
            },
            {
                icon: "📸",
                title: "التصوير في العمل",
                q: "تريد تصوير سيلفي في المكتب، وخلفك تظهر شاشة زميلك بها بيانات. ماذا تفعل؟",
                options: [
                    { text: "أنشر الصورة، لا أحد سيركز", correct: false, msg: "خطر! تسريب بيانات العمل عبر الصور هو خطأ أمني جسيم." },
                    { text: "أغير المكان لضمان خصوصية البيانات", correct: true, msg: "ممتاز! الحفاظ على خصوصية ما يظهر في الصور جزء من الأمان." }
                ]
            },
            {
                icon: "📱",
                title: "تطبيقات مجهولة",
                q: "وجدت تطبيقاً يوفر ميزات إضافية مجانية لكنه من خارج المتجر الرسمي. ماذا تفعل؟",
                options: [
                    { text: "أقوم بتحميله وتجربته", correct: false, msg: "خطر! التطبيقات خارج المتاجر الرسمية غالباً ما تكون محقونة بفيروسات." },
                    { text: "أكتفي بالتطبيقات الرسمية فقط", correct: true, msg: "رائع! تحميل التطبيقات من مصادر موثوقة يحمي هاتفك من التجسس." }
                ]
            }
        ];

        let currentStep = -1;
        let score = 0;
        const box = document.getElementById('game-box');

        function startScreen() {
            box.innerHTML = `
                <div class="p-10 text-center flex-1 flex flex-col justify-center result-screen">
                    <div class="text-8xl mb-6">🛡️</div>
                    <h1 class="text-3xl font-black text-slate-900 mb-4">اختبار الوعي الأمني</h1>
                    <p class="text-slate-600 mb-8 text-lg leading-relaxed">10 مواقف ستكشف هل أنت فريسة سهلة أم حصن منيع للمعلومات!</p>
                    <button onclick="renderQuestion()" class="w-full bg-blue-600 text-white font-bold py-5 rounded-2xl text-xl shadow-lg hover:bg-blue-700 active:scale-95 transition-all">
                        ابدأ التحدي (10 مراحل)
                    </button>
                </div>
            `;
        }

        function renderQuestion() {
            currentStep++;
            if(currentStep < allQuestions.length) {
                const item = allQuestions[currentStep];
                const progress = ((currentStep) / allQuestions.length) * 100;
                
                box.innerHTML = `
                    <div class="p-8 flex-1 flex flex-col result-screen">
                        <div class="w-full bg-slate-100 h-2 rounded-full mb-6">
                            <div class="bg-blue-600 h-2 rounded-full transition-all duration-500" style="width: ${progress}%"></div>
                        </div>
                        <div class="flex justify-between items-center mb-4">
                            <span class="bg-blue-100 text-blue-700 px-4 py-1 rounded-full text-xs font-bold">موقف ${currentStep + 1}</span>
                            <span class="text-slate-400 font-bold">${currentStep + 1}/${allQuestions.length}</span>
                        </div>
                        <div class="text-center mb-6">
                            <div class="text-6xl mb-2">${item.icon}</div>
                            <h2 class="text-2xl font-bold text-slate-800">${item.title}</h2>
                        </div>
                        <div class="bg-slate-50 p-5 rounded-2xl mb-8 border-r-4 border-blue-500">
                            <p class="text-slate-700 text-lg font-medium leading-relaxed">${item.q}</p>
                        </div>
                        <div class="space-y-3 mt-auto">
                            ${item.options.map(o => `
                                <button onclick="showFeedback(${o.correct}, '${o.msg}')" class="option-btn w-full p-4 rounded-xl bg-white text-right font-bold text-slate-700 shadow-sm">
                                    ${o.text}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else {
                showFinal();
            }
        }

        function showFeedback(isCorrect, message) {
            if(isCorrect) score++;
            box.innerHTML = `
                <div class="p-10 text-center flex-1 flex flex-col justify-center result-screen">
                    <div class="text-8xl mb-6">${isCorrect ? '✨' : '⚠️'}</div>
                    <h2 class="text-3xl font-bold mb-4 ${isCorrect ? 'text-green-600' : 'text-red-500'}">
                        ${isCorrect ? 'إجابة ذكية!' : 'تصرف خطر!'}
                    </h2>
                    <div class="bg-slate-50 p-6 rounded-2xl mb-10">
                        <p class="text-slate-600 text-xl font-medium leading-relaxed">${message}</p>
                    </div>
                    <button onclick="renderQuestion()" class="w-full bg-slate-900 text-white font-bold py-5 rounded-2xl text-lg shadow-lg hover:bg-black transition-all">
                        ${currentStep < allQuestions.length - 1 ? 'الموقف التالي' : 'رؤية النتيجة النهائية'}
                    </button>
                </div>
            `;
        }

        function showFinal() {
            let rank = "مبتدئ سيبراني 🐣";
            let color = "text-red-500";
            if(score === 10) { rank = "بطل سيبراني أسطوري! 🏆"; color = "text-green-600"; }
            else if(score >= 8) { rank = "خبير أمني محترف 🛡️"; color = "text-blue-600"; }
            else if(score >= 5) { rank = "مستوى متوسط 🧐"; color = "text-yellow-600"; }

            box.innerHTML = `
                <div class="p-10 text-center flex-1 flex flex-col justify-center result-screen">
                    <h2 class="text-slate-400 font-bold uppercase tracking-widest mb-2">النتيجة النهائية</h2>
                    <div class="text-9xl font-black text-blue-600 mb-4">${score}/10</div>
                    <p class="text-2xl font-bold ${color} mb-10">${rank}</p>
                    <button onclick="location.reload()" class="w-full bg-blue-600 text-white font-bold py-5 rounded-2xl text-xl shadow-xl hover:bg-blue-700 transition-all">
                        إعادة التحدي
                    </button>
                    <p class="mt-6 text-slate-400 text-sm">وعيك يحمي الجميع.. شارك التحدي مع أصدقائك!</p>
                </div>
            `;
        }

        startScreen();
    </script>
</body>
</html>
