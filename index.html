<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- استخدام Tailwind CSS للتصميم -->

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">

    <style>

        body { 

            font-family: 'Tajawal', sans-serif; 

            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            margin: 0;

            padding: 20px;

        }

        .app-container {

            width: 100%;

            max-width: 450px;

            background: rgba(255, 255, 255, 0.95);

            border-radius: 2rem;

            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);

            min-height: 550px;

            display: flex;

            flex-direction: column;

            overflow: hidden;

            animation: slideUp 0.6s ease-out;

        }

        @keyframes slideUp {

            from { opacity: 0; transform: translateY(30px); }

            to { opacity: 1; transform: translateY(0); }

        }

        .option-btn {

            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);

            border: 2px solid #e2e8f0;

        }

        .option-btn:hover {

            border-color: #3b82f6;

            background-color: #eff6ff;

            transform: translateX(-5px);

        }

        .result-screen { animation: fadeIn 0.4s ease-in; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    </style>

</head>

<body>



    <div id="game-box" class="app-container">

        <!-- المحتوى سيظهر هنا -->

    </div>



    <script>

        const gameData = [

            {

                icon: "🛡️",

                title: "مهمة: التصيد",

                q: "وصلتك رسالة نصية تطلب منك الضغط على رابط لتحديث بياناتك البنكية فوراً. ماذا تفعل؟",

                options: [

                    { text: "أضغط على الرابط للتأكد", correct: false, msg: "خطأ! الروابط في الرسائل النصية المجهولة هي فخ للتصيد." },

                    { text: "أتجاهل الرسالة وأبلغ عنها", correct: true, msg: "أحسنت! تجاهل الروابط المشبوهة هو ذكاء سيبراني." }

                ]

            },

            {

                icon: "🔐",

                title: "مهمة: كلمات السر",

                q: "أي من هذه الكلمات تعتبر الأقوى لحماية حسابك الشخصي؟",

                options: [

                    { text: "Admin12345", correct: false, msg: "ضعيفة! هذه الكلمات يسهل تخمينها برمجياً في ثوانٍ." },

                    { text: "Mypet#77!Blue", correct: true, msg: "بطل! استخدام الرموز والأرقام والكلمات الطويلة يصعّب الاختراق." }

                ]

            },

            {

                icon: "💻",

                title: "مهمة: المكتب",

                q: "تريد الذهاب للصلاة وتريد ترك جهازك في المكتب. كيف تتركه؟",

                options: [

                    { text: "أتركه شغالاً كما هو", correct: false, msg: "خطر! ترك الجهاز مفتوحاً يسهل الوصول لبيانات الشركة الحساسة." },

                    { text: "أضغط Win + L لقفل الشاشة", correct: true, msg: "رائع! قفل الشاشة عند مغادرة المكتب قاعدة ذهبية." }

                ]

            }

        ];



        let currentStep = -1;

        let score = 0;

        const box = document.getElementById('game-box');



        function init() {

            box.innerHTML = `

                <div class="p-10 text-center flex-1 flex flex-col justify-center result-screen">

                    <div class="text-7xl mb-6">🕵️‍♂️</div>

                    <h1 class="text-3xl font-black text-slate-900 mb-4">بطل الأمن السيبراني</h1>

                    <p class="text-slate-600 mb-8 text-lg leading-relaxed">هل أنت واعٍ بما يكفي لحماية بياناتك؟ اختبر نفسك الآن!</p>

                    <button onclick="renderQuestion()" class="w-full bg-blue-600 text-white font-bold py-5 rounded-2xl text-xl shadow-lg hover:bg-blue-700 active:scale-95 transition-all">

                        ابدأ التحدي

                    </button>

                </div>

            `;

        }



        function renderQuestion() {

            currentStep++;

            if(currentStep < gameData.length) {

                const item = gameData[currentStep];

                box.innerHTML = `

                    <div class="p-8 flex-1 flex flex-col result-screen">

                        <div class="flex justify-between items-center mb-6">

                            <span class="bg-blue-100 text-blue-700 px-4 py-1 rounded-full font-bold">مهمة ${currentStep + 1}</span>

                            <span class="text-slate-400 font-bold">${currentStep + 1}/${gameData.length}</span>

                        </div>

                        <div class="text-center mb-8">

                            <div class="text-6xl mb-4">${item.icon}</div>

                            <h2 class="text-2xl font-bold text-slate-800">${item.title}</h2>

                        </div>

                        <div class="bg-slate-50 p-6 rounded-2xl mb-8 border-r-4 border-blue-500">

                            <p class="text-slate-700 text-lg font-medium leading-relaxed">${item.q}</p>

                        </div>

                        <div class="space-y-4 mt-auto">

                            ${item.options.map(o => `

                                <button onclick="showFeedback(${o.correct}, '${o.msg}')" class="option-btn w-full p-5 rounded-xl bg-white text-right font-bold text-slate-700 shadow-sm">

                                    ${o.text}

                                </button>

                            `).join('')}

                        </div>

                    </div>

                `;

            } else {

                showFinal();

            }

        }



        function showFeedback(isCorrect, message) {

            if(isCorrect) score++;

            box.innerHTML = `

                <div class="p-10 text-center flex-1 flex flex-col justify-center result-screen">

                    <div class="text-8xl mb-6">${isCorrect ? '✨' : '❌'}</div>

                    <h2 class="text-3xl font-bold mb-4 ${isCorrect ? 'text-green-600' : 'text-red-500'}">

                        ${isCorrect ? 'إجابة ذكية!' : 'تحذير أمني!'}

                    </h2>

                    <div class="bg-slate-50 p-6 rounded-2xl mb-10">

                        <p class="text-slate-600 text-xl font-medium">${message}</p>

                    </div>

                    <button onclick="renderQuestion()" class="w-full bg-slate-900 text-white font-bold py-5 rounded-2xl text-lg shadow-lg">

                        المتابعة

                    </button>

                </div>

            `;

        }



        function showFinal() {

            let status = score === 3 ? "بطل سيبراني خبير! 🏅" : "تحتاج لمزيد من الوعي 🛡️";

            box.innerHTML = `

                <div class="p-10 text-center flex-1 flex flex-col justify-center result-screen">

                    <h2 class="text-slate-400 font-bold uppercase tracking-widest mb-2">النتيجة النهائية</h2>

                    <div class="text-9xl font-black text-blue-600 mb-4">${score}/3</div>

                    <p class="text-2xl font-bold text-slate-800 mb-10">${status}</p>

                    <button onclick="location.reload()" class="w-full bg-blue-600 text-white font-bold py-5 rounded-2xl text-xl shadow-xl">

                        إعادة الاختبار

                    </button>

                    <p class="mt-6 text-slate-400 text-sm">شارك هذا التحدي مع زملائك</p>

                </div>

            `;

        }



        init();

    </script>

</body>

</html>
