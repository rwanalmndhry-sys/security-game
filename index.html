<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تحدي الوعي الرقمي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Tajawal', sans-serif; 
            background: #0f172a;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent; /* منع اللون الأزرق في الجوال */
        }
        .app-card {
            background: #ffffff;
            width: 90%;
            max-width: 400px;
            border-radius: 2rem;
            min-height: 580px;
            display: flex;
            flex-direction: column;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
        }
        .btn-opt {
            width: 100%;
            padding: 1.2rem;
            border: 2px solid #f1f5f9;
            border-radius: 1.2rem;
            background: #f8fafc;
            font-weight: 700;
            color: #334155;
            text-align: right;
            transition: 0.2s;
            cursor: pointer;
            outline: none !important;
            display: block;
            position: relative;
            z-index: 50; /* ضمان ظهور الزر فوق أي طبقة */
        }
        .btn-opt:active {
            transform: scale(0.96);
            background: #e2e8f0;
        }
        .icon-box {
            width: 80px;
            height: 80px;
            background: #eff6ff;
            border-radius: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 1.5rem;
        }
    </style>
</head>
<body>

    <div id="quiz-app" class="app-card">
        <!-- المحتوى يتغير برمجياً -->
    </div>

    <script>
        const rawData = [
            { i: "📧", q: "وصلك إيميل يطلب منك تحديث كلمة سرك فوراً عبر رابط خارجي. ماذا تفعل؟", 
              o: [{t: "أضغط على الرابط بسرعة", c: false, m: "خطأ! الاستعجال هو فخ التصيد الأول."}, {t: "أحذف الرسالة وأبلغ التقنية", c: true, m: "رائع! الحذر هو أقوى سلاح."}] },
            { i: "🔐", q: "أي كلمة مرور هي الأفضل لحماية حسابك؟", 
              o: [{t: "Password123", c: false, m: "سهلة الاختراق جداً!"}, {t: "M@rch#2026!Sky", c: true, m: "ممتاز! الطول والرموز هما السر."}] },
            { i: "💻", q: "ستترك مكتبك لمدة 5 دقائق. كيف تحمي جهازك؟", 
              o: [{t: "أتركه مفتوحاً", c: false, m: "غير آمن! البيانات قد تسرق في ثوانٍ."}, {t: "أقفل الشاشة فوراً", c: true, m: "بطل! قفل الشاشة يحمي خصوصيتك."}] },
            { i: "💾", q: "وجدت فلاش ميموري مجهول في ممر العمل. ماذا تفعل؟", 
              o: [{t: "أجربه لأعرف ما بداخله", c: false, m: "خطر! قد يحتوي على فيروسات تجسس."}, {t: "أسلمه للأمن فوراً", c: true, m: "ذكي! الأجهزة المجهولة فخاخ رقمية."}] },
            { i: "📱", q: "رسالة من البنك تطلب منك الضغط على رابط لتحديث بياناتك. هل تضغط؟", 
              o: [{t: "نعم، لتجنب إيقاف الحساب", c: false, m: "خطأ! البنوك لا تطلب البيانات عبر روابط نصية."}, {t: "لا، أتصل بالبنك مباشرة", c: true, m: "أحسنت! التواصل الرسمي هو الأضمن."}] },
            { i: "📡", q: "هل تستخدم واي فاي المقهى للدخول على حسابات العمل؟", 
              o: [{t: "نعم، لأنه أسرع", c: false, m: "خطر! الشبكات العامة مرتع للمخترقين."}, {t: "لا، أستخدم باقة الجوال", c: true, m: "رائع! اتصالك الخاص أكثر أماناً."}] },
            { i: "⚙️", q: "هناك تحديث أمني متاح لنظامك. متى تثبته؟", 
              o: [{t: "عندما أفضى لاحقاً", c: false, m: "خطر! التأجيل يعرضك للثغرات."}, {t: "الآن فوراً", c: true, m: "بطل! التحديثات هي درعك المتجدد."}] },
            { i: "📞", q: "اتصال يدعي صاحبه أنه من الدعم الفني ويطلب رقمك السري. هل تعطيه؟", 
              o: [{t: "نعم، ليحل المشكلة", c: false, m: "خطر! لا أحد يطلب رقمك السري هاتفياً."}, {t: "أرفض وأغلق الخط", c: true, m: "ممتاز! أنت محصن ضد الهندسة الاجتماعية."}] },
            { i: "📷", q: "تصور صورة في المكتب وتظهر فيها أوراق سرية. هل تنشرها؟", 
              o: [{t: "نعم، الصورة جميلة", c: false, m: "خطأ! تسريب البيانات بالصور كارثة أمنية."}, {t: "أمسحها أو أخفي البيانات", c: true, m: "واعي! التفاصيل الصغيرة تصنع الأمان."}] },
            { i: "📥", q: "تطبيق يطلب صلاحية الوصول لموقعك وصورك دون سبب. هل توافق؟", 
              o: [{t: "نعم، أريد استخدامه", c: false, m: "خطر! الصلاحيات الزائدة تفتح باب التجسس."}, {t: "أرفض وأحذف التطبيق", c: true, m: "رائع! بياناتك الشخصية لا تقدر بثمن."}] }
        ];

        let questions = [];
        let cur = 0;
        let score = 0;
        const app = document.getElementById('quiz-app');

        // وظيفة لخلط أي مصفوفة (عشوائية)
        function shuffle(arr) { return arr.sort(() => Math.random() - 0.5); }

        function start() {
            // خلط الأسئلة عند البداية
            questions = shuffle([...rawData]);
            app.innerHTML = `
                <div class="my-auto text-center">
                    <div class="text-8xl mb-6">🛡️</div>
                    <h1 class="text-3xl font-black text-slate-800 mb-4">تحدي الأمان</h1>
                    <p class="text-slate-500 mb-10">هل أنت مستعد لاختبار وعيك السيبراني؟</p>
                    <button onclick="renderQ()" class="w-full bg-blue-600 text-white font-bold py-5 rounded-2xl shadow-lg active:scale-95 transition-all">ابدأ التحدي (10 أسئلة)</button>
                </div>
            `;
        }

        function renderQ() {
            if(cur >= questions.length) { finish(); return; }
            const qObj = questions[cur];
            // خلط الخيارات لكل سؤال بشكل منفصل
            const opts = shuffle([...qObj.o]);

            app.innerHTML = `
                <div class="w-full bg-slate-100 h-2 rounded-full mb-8 overflow-hidden">
                    <div class="bg-blue-600 h-full transition-all duration-500" style="width:${(cur+1)*10}%"></div>
                </div>
                <div class="icon-box">${qObj.i}</div>
                <div class="text-center mb-8 flex-grow">
                    <p class="text-sm font-bold text-blue-600 mb-2 uppercase tracking-widest">الموقف ${cur+1}</p>
                    <h2 class="text-xl font-bold text-slate-800 leading-relaxed">${qObj.q}</h2>
                </div>
                <div class="grid gap-4">
                    ${opts.map(opt => `
                        <button onclick="check(${opt.c}, '${opt.m}')" class="btn-opt">${opt.t}</button>
                    `).join('')}
                </div>
            `;
        }

        function check(isC, msg) {
            if(isC) score++;
            app.innerHTML = `
                <div class="my-auto text-center animate-in fade-in duration-500">
                    <div class="text-8xl mb-6">${isC ? '✅' : '❌'}</div>
                    <h2 class="text-3xl font-black mb-4 ${isC ? 'text-green-600' : 'text-red-500'}">${isC ? 'رائع!' : 'انتبه!'}</h2>
                    <div class="bg-slate-50 p-6 rounded-2xl mb-10 border-2 border-slate-100">
                        <p class="text-slate-600 font-bold leading-relaxed">${msg}</p>
                    </div>
                    <button onclick="next()" class="w-full bg-slate-900 text-white font-bold py-5 rounded-2xl shadow-lg active:scale-95 transition-all">الموقف التالي</button>
                </div>
            `;
        }

        function next() { cur++; renderQ(); }

        function finish() {
            let rank = score >= 8 ? "بطل سيبراني" : (score >= 5 ? "واعي تقنياً" : "تحتاج تدريب");
            app.innerHTML = `
                <div class="my-auto text-center">
                    <p class="text-slate-400 font-bold mb-2">نتيجتك النهائية</p>
                    <div class="text-8xl font-black text-blue-600 mb-6">${score}/10</div>
                    <h2 class="text-2xl font-bold text-slate-800 mb-10">${rank}</h2>
                    <button onclick="location.reload()" class="w-full bg-blue-600 text-white font-bold py-5 rounded-2xl shadow-lg">إعادة المحاولة</button>
                </div>
            `;
        }

        start();
    </script>
</body>
</html>
